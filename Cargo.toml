[workspace]
members = ["crates/*", "xtask"]
default-members = ["crates/bao"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/roushou/bao"

[workspace.dependencies]
anyhow = "1"
crossterm = { version = "0.28", features = ["event-stream"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
bao-core = { path = "crates/bao-core" }
bao-protocol = { path = "crates/bao-protocol" }
bao-transport = { path = "crates/bao-transport" }
bao-client = { path = "crates/bao-client" }
bao-daemon = { path = "crates/bao-daemon" }
bao-tui = { path = "crates/bao-tui" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
